<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mini game - Hứng táo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h2>Mini game: Hứng táo</h2>
  <p class="thong-tin">
    Điểm: <span id="score">0</span>
    &nbsp;|&nbsp;
    Mạng sống: <span id="lives">3</span>
  </p>

  <div id="game-container">
    <div id="apple"></div>
    <div id="basket"></div>
    <div id="message">Game Over</div>
  </div>

  <button id="start-btn">Bắt đầu</button>
  <p>Dùng phím mũi tên Trái / Phải để di chuyển giỏ.</p>

  <script src="index.js"></script>
</body>
</html>
